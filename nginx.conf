map $http_accept $markdown_suffix {
    default "";
    "~*text/markdown" ".md";
}

server {
    listen       8080;
    server_name  localhost;

    # Homepage — Link headers and markdown negotiation
    location = / {
        root /usr/share/nginx/html;

        if ($markdown_suffix = ".md") {
            rewrite ^ /index.md last;
        }

        try_files /index.html =404;

        add_header Link '</.well-known/api-catalog>; rel="api-catalog"' always;
        add_header Link '</docs/api.md>; rel="service-doc"' always;
        add_header Link '</openapi/site-api.yaml>; rel="service-desc"' always;
        add_header Link '</.well-known/agent-skills/index.json>; rel="describedby"' always;
        add_header Link '</auth.md>; rel="describedby"' always;

        index index.html;
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri$markdown_suffix $uri $uri/ /index.html;
        index  index.html index.htm;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }

    location = /auth.md {
        root /usr/share/nginx/html;
        default_type text/markdown;
        add_header x-markdown-tokens "180" always;
    }

    location ~ \.md$ {
        root /usr/share/nginx/html;
        default_type text/markdown;
        add_header x-markdown-tokens "250" always;
    }

    location = /.well-known/api-catalog {
        alias /usr/share/nginx/html/.well-known/api-catalog;
        default_type application/linkset+json;
        add_header Content-Type 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"' always;
    }

    location = /.well-known/oauth-authorization-server {
        alias /usr/share/nginx/html/.well-known/oauth-authorization-server;
        default_type application/json;
    }

    location = /.well-known/oauth-protected-resource {
        alias /usr/share/nginx/html/.well-known/oauth-protected-resource;
        default_type application/json;
    }

    location = /.well-known/jwks.json {
        alias /usr/share/nginx/html/.well-known/jwks.json;
        default_type application/json;
    }

    location = /.well-known/agent-skills/index.json {
        alias /usr/share/nginx/html/.well-known/agent-skills/index.json;
        default_type application/json;
    }

    location = /.well-known/mcp/server-card.json {
        alias /usr/share/nginx/html/.well-known/mcp/server-card.json;
        default_type application/json;
    }

    location ~ ^/api/v1/(health|contact)$ {
        root /usr/share/nginx/html;
        default_type application/json;
    }

    gzip  on;
    gzip_http_version 1.0;
    gzip_comp_level 2;
    gzip_min_length 1100;
    gzip_buffers     4 8k;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/linkset+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        application/x-font-truetype
        application/x-javascript
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/opentype
        font/otf
        image/svg+xml
        image/x-icon
        image/vnd.microsoft.icon
        image/bmp
        image/png
        image/gif
        image/jpeg
        image/jpg
        text/css
        text/plain
        text/markdown
        text/javascript
        text/x-component;
    gzip_disable "MSIE [1-6]\.";
    gzip_static on;
    gzip_vary on;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
